[package]
name = "arrowhead-core-rust"
version = "5.4.0"
edition = "2024"
rust-version = "1.89"
license = "EPL-2.0"
description = "Native Rust development implementation of the five local Arrowhead 5.2.2 core modules"
default-run = "arrowhead-core"

[dependencies]
arrowhead-messaging-rust = { path = "../ah5-messaging-rust" }
axum = "0.8.9"
aes = "0.8"
bcrypt = "0.17"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "arrowhead-core"
path = "src/main.rs"

[[bin]]
name = "core-documentation"
path = "src/bin/documentation.rs"

[[bin]]
name = "serviceregistry"
path = "serviceregistry/src/main.rs"

[[bin]]
name = "authentication"
path = "authentication/src/main.rs"

[[bin]]
name = "consumer-authorization"
path = "consumer-authorization/src/main.rs"

[[bin]]
name = "serviceorchestration-dynamic"
path = "serviceorchestration-dynamic/src/main.rs"

[[bin]]
name = "serviceorchestration-simple"
path = "serviceorchestration-simple/src/main.rs"

